toggles = [
  { control = "noise_gate_enable", label = "Gate" }
  { control = "amp_enable", label = "Amp" }
  { control = "volume_enable", label = "Volume" }
  { control = "effect_enable", label = "FX",
    rules = [
      "effect_select=0:opacity=0", "effect_select=1:opacity=0", "effect_select=2:opacity=0",
      "effect_select=*:opacity=1"
    ]
  }
  { control = "delay_enable", label = "Delay" }
  { control = "reverb_enable", label = "Reverb" }
]

groups = [
  # LEFT -------------------------------------------------------
  { group = "Preamp", column = 0,
    controls = [
      { control = "amp_select", widget = "combo" }
      { control = "drive", widget = "slider", label = "Drive" }
      { control = "drive2", widget = "slider", label = "Drive 2",
        rules = [ "amp_select=4:show", "amp_select=*:hide" ],
        label-rules = [ "amp_select=4:opacity=1", "amp_select=*:opacity=0" ] }
      { control = "bass", widget = "slider", label = "Bass" }
      { control = "mid", widget = "slider", label = "Mid" }
      { control = "treble", widget = "slider", label = "Treble" }
      { control = "presence", widget = "slider", label = "Presence",
        rules = [ "presence:show=0:hide", "presence:show=1:show" ],
        label-rules = [ "presence:show=0:opacity=0", "presence:show=1:opacity=1" ] }
      { control = "chan_volume", widget = "slider", label = "Chan Volume" }
    ]
  }

  { group = "Noise Gate", column = 0, toggle = "noise_gate_enable",
    rules = [ "noise_gate_enable=1:enable", "noise_gate_enable=0:disable" ],
    controls = [
      { control = "gate_threshold", widget = "slider", label = "Threshold" }
      { control = "gate_decay", widget = "slider", label = "Decay Time" }
    ]
  }

  { group = "Reverb", column = 0, toggle = "reverb_enable",
    rules = [ "reverb_enable=1:enable", "reverb_enable=0:disable" ],
    controls = [
      { control = "reverb_type", widget = "radio-group", label = "Type",
        options = [ { value = 0, label = "Spring" }, { value = 1, label = "Hall" } ] }
      { control = "reverb_decay", widget = "slider", label = "Decay" }
      { control = "reverb_density", widget = "slider", label = "Density" }
      { control = "reverb_diffusion", widget = "slider", label = "Diffusion" }
      { control = "reverb_tone", widget = "slider", label = "Tone" }
      { control = "reverb_level", widget = "slider", label = "Level" }
    ]
  }

  { group = "Volume Pedal", column = 0,
    controls = [
      { control = "vol_level", widget = "slider", label = "Level" }
      { control = "vol_minimum", widget = "slider", label = "Minimum" }
    ]
  }

  { group = "Digital Out", column = 0,
    rules = [ "digiout_show=1:show", "digiout_show=0:hide" ],
    controls = [
      { control = "digiout_gain", widget = "slider", label = "Gain" }
    ]
  }

  # RIGHT -------------------------------------------------------
  { group = "Cabinet", column = 1,
    controls = [
      { control = "cab_select", widget = "combo" }
      { control = "air", widget = "slider", label = "Air" }
    ]
  }

  { group = "Delay", column = 1, toggle = "delay_enable",
    rules = [ "delay_enable=1:enable", "delay_enable=0:disable" ],
    controls = [
      { control = "delay_time", widget = "slider", label = "Time" }
      { control = "delay_feedback", widget = "slider", label = "Feedback" }
      { control = "delay_level", widget = "slider", label = "Level" }
    ]
  }

  { group = "FX", column = 1, toggle = "effect_enable",
    controls = [
      { control = "effect_select", widget = "combo" }
      { control = "compression_ratio", widget = "slider", label = "Ratio",
        rules = [ "effect_select=1:show", "effect_select=*:hide" ],
        label-rules = [ "effect_select=1:show", "effect_select=*:hide" ] }
      { control = "volume_swell_time", widget = "slider", label = "Atack Time",
        rules = [ "effect_select=2:show", "effect_select=*:hide" ],
        label-rules = [ "effect_select=2:show", "effect_select=*:hide" ] }
      { control = "chorus_flanger_speed", widget = "slider", label = "Speed",
        rules = [ "effect_select=3:show", "effect_select=4:show", "effect_select=5:show", "effect_select=6:show", "effect_select=*:hide" ],
        label-rules = [ "effect_select=3:show", "effect_select=4:show", "effect_select=5:show", "effect_select=6:show", "effect_select=*:hide" ] }
      { control = "chorus_flanger_depth", widget = "slider", label = "Depth",
        rules = [ "effect_select=3:show", "effect_select=4:show", "effect_select=5:show", "effect_select=6:show", "effect_select=*:hide" ],
        label-rules = [ "effect_select=3:show", "effect_select=4:show", "effect_select=5:show", "effect_select=6:show", "effect_select=*:hide" ] }
      { control = "chorus_flanger_feedback", widget = "slider", label = "Feedback",
        rules = [ "effect_select=3:show", "effect_select=4:show", "effect_select=5:show", "effect_select=6:show", "effect_select=*:hide" ],
        label-rules = [ "effect_select=3:show", "effect_select=4:show", "effect_select=5:show", "effect_select=6:show", "effect_select=*:hide" ] }
      { control = "chorus_flanger_pre_delay", widget = "slider", label = "Pre-delay",
        rules = [ "effect_select=3:show", "effect_select=4:show", "effect_select=5:show", "effect_select=6:show", "effect_select=*:hide" ],
        label-rules = [ "effect_select=3:show", "effect_select=4:show", "effect_select=5:show", "effect_select=6:show", "effect_select=*:hide" ] }
      { control = "trem_speed", widget = "slider", label = "Speed",
        rules = [ "effect_select=7:show", "effect_select=*:hide" ],
        label-rules = [ "effect_select=7:show", "effect_select=*:hide" ] }
      { control = "trem_depth", widget = "slider", label = "Depth",
        rules = [ "effect_select=7:show", "effect_select=*:hide" ],
        label-rules = [ "effect_select=7:show", "effect_select=*:hide" ] }
      { control = "rotary_speed", widget = "slider", label = "Speed",
        rules = [ "effect_select=8:show", "effect_select=*:hide" ],
        label-rules = [ "effect_select=8:show", "effect_select=*:hide" ] }
      { control = "rotary_fast_speed", widget = "slider", label = "Fast Speed",
        rules = [ "effect_select=8:show", "effect_select=*:hide" ],
        label-rules = [ "effect_select=8:show", "effect_select=*:hide" ] }
      { control = "rotary_slow_speed", widget = "slider", label = "Slow Speed",
        rules = [ "effect_select=8:show", "effect_select=*:hide" ],
        label-rules = [ "effect_select=8:show", "effect_select=*:hide" ] }
      { control = "effect_tweak", widget = "slider", label = "Depth",
        rules = [ "effect_select=8:show", "effect_select=*:hide" ],
        label-rules = [ "effect_select=8:show", "effect_select=*:hide" ] }
    ]
  }

  { group = "Switches", column = 1,
    controls = [
      { control = "distortion_enable", widget = "toggle", label = "Distortion" }
      { control = "eq_enable", widget = "toggle", label = "EQ" }
      { control = "drive_enable", widget = "toggle", label = "Drive" }
      { control = "bright_switch_enable", widget = "toggle", label = "Bright",
        rules = [ "bright_switch:show=0:hide", "bright_switch:show=1:show" ],
        label-rules = [ "bright_switch:show=0:opacity=0", "bright_switch:show=1:opacity=1" ] }
    ]
  }

  { group = "Wah Pedal", column = 1,
    controls = [
      { control = "wah_level", widget = "slider", label = "Level" }
      { control = "wah_bottom_freq", widget = "slider", label = "Lower Freq" }
      { control = "wah_top_freq", widget = "slider", label = "Upper Freq" }
    ]
  }
]
